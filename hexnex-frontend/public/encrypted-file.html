<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/svg+xml" href="/logo.png" />
  <title>Encrypted File</title>
  <style>
    body {
      font-family: "Courier New", monospace;
      background-color: #f4f4f4;
      color: #333;
    }
    .fake-message {
      background-color: #d9edf7;
      padding: 10px;
      margin-bottom: 10px;
      border-left: 5px solid #31708f;
    }
    .loading-bar {
      width: 100%;
      height: 20px;
      background: linear-gradient(90deg, #e0e0e0 25%, #ffffff 50%, #e0e0e0 75%);
      animation: loading 1.5s infinite;
    }
    @keyframes loading {
      0% {background-position: -100px;}
      100% {background-position: 100px;}
    }
    .status-log {
      font-size: 12px;
      color: green;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h3>🔐 Encrypted File Page</h3>

  <div class="fake-message">
    Status: Connection to secure server established...<br>
    Waiting for payload verification...
  </div>

  <div class="loading-bar"></div>

  <div class="fake-message">
    Verification Timeout.<br>
    Reinitializing handshake protocol. Please stand by.
  </div>

  <div class="status-log">
    [✔] Trace ID: 0930-XY78<br>
    [✔] Cipher Key: Auto-Negotiated<br>
    [✔] Decryption Handler Loaded
  </div>

  <!-- final payload password: finalpayload -->
</body>
</html>
