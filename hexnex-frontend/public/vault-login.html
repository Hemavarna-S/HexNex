<!DOCTYPE html>
<html>
<head>
  <title>Vault Login</title>
  <style>
    body {
      font-family: 'Consolas', monospace;
      background-color: #1e1e1e;
      color: #0ff;
      padding: 20px;
    }
    h3 {
      color: #f00;
      text-shadow: 1px 1px 2px #ff0;
    }
    .login-form {
      margin-top: 20px;
      background-color: #333;
      padding: 15px;
      border: 2px dashed #0ff;
      max-width: 400px;
    }
    input {
      margin: 5px 0;
      width: 100%;
      padding: 8px;
      background-color: #222;
      color: #0ff;
      border: 1px solid #0ff;
    }
    .warning {
      color: yellow;
      font-style: italic;
      margin-top: 10px;
    }
    .glitch {
      animation: glitchAnim 2s infinite;
    }
    @keyframes glitchAnim {
      0% {opacity: 1;}
      50% {opacity: 0.4;}
      100% {opacity: 1;}
    }
  </style>
</head>
<body>
  <h3 class="glitch">⚠️ Legacy Vault Login Portal ⚠️</h3>

  <div class="warning glitch">
    Warning: This system is not compatible with your browser version.
    Unexpected behavior may occur. Proceed with caution.
  </div>

  <div class="login-form">
    <label>Username:</label>
    <input type="text" placeholder="Enter credentials">
    <label>Password:</label>
    <input type="password" placeholder="********">
    <p style="color:red;">System Error: Validation module missing</p>
  </div>

  <div class="warning">
    System Status: [X] Cipher handshake failed<br>
    Memory pool leakage detected<br>
    Tracking code: 00492-VLT-X9<br>
  </div>

  <!-- correct username: vault_keeper -->
</body>
</html>
